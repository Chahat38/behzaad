<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Mission Control — Leads</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Inter:wght@400;500&family=Caveat:wght@500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/admin/css/admin.css" />
  </head>
  <body class="admin-body">
    <div class="admin-shell">
      <aside class="admin-sidebar" id="admin-sidebar">
        <div class="admin-logo">Behzad Qureshi<small>Mission Control</small></div>
        <nav class="admin-nav">
          <a href="/admin/" data-nav="dashboard">Dashboard</a>
          <a href="/admin/leads.html" data-nav="leads" class="active">Leads <span class="count" id="nav-count-leads">0</span></a>
          <a href="/admin/content.html" data-nav="content">Content</a>
          <a href="/admin/settings.html" data-nav="settings">Settings</a>
        </nav>
        <div class="foot">Supabase CRM · Behzaad Qureshi</div>
      </aside>
      <div class="admin-scrim" id="admin-scrim" onclick="window.Admin.shell?.closeSidebar()"></div>
      <div class="admin-main">
        <header class="admin-topbar">
          <button class="admin-btn sm admin-burger" id="admin-burger" aria-label="Open menu">☰</button>
          <h1 id="admin-topbar-title">Leads</h1>
          <div class="spacer"></div>
          <span id="admin-topbar-user" class="admin-muted" style="font-size: 12px;"></span>
          <button class="admin-btn sm" id="admin-logout">Logout</button>
        </header>
        <main class="admin-content">
          <div id="admin-leads-root">
            <div class="admin-toolbar" id="leads-toolbar">
              <div class="field" style="flex: 1 1 240px;"><input id="leads-search" class="admin-input" placeholder="Search name / email / phone / message…" /></div>
              <div class="field"><select id="leads-status" class="admin-select"><option value="">All statuses</option></select></div>
              <div class="field"><select id="leads-source" class="admin-select"><option value="">All sources</option></select></div>
              <div class="field"><input id="leads-from" class="admin-input" type="date" /></div>
              <div class="field"><input id="leads-to" class="admin-input" type="date" /></div>
              <div class="field"><select id="leads-assignee" class="admin-select"><option value="">All assignees</option></select></div>
              <div class="field" style="flex: 0 0 auto; display: flex; gap: 8px;">
                <button class="admin-btn" id="leads-btn-table" data-view="table">Table</button>
                <button class="admin-btn" id="leads-btn-kanban" data-view="kanban">Kanban</button>
              </div>
              <div class="field" style="flex: 0 0 auto; display: flex; gap: 8px;">
                <button class="admin-btn primary" id="leads-btn-add">+ Add lead</button>
                <button class="admin-btn" id="leads-btn-export">Export CSV</button>
              </div>
            </div>
            <div id="admin-bulk-bar" class="admin-card" style="display:none; margin-bottom:16px; padding:12px 18px;">
              <div class="admin-row">
                <strong id="bulk-count">0</strong>
                <span class="admin-muted">selected</span>
                <div style="flex:1"></div>
                <select id="bulk-status" class="admin-select" style="width:auto;"><option value="">Set status…</option></select>
                <button class="admin-btn sm" id="bulk-apply-status">Apply</button>
                <button class="admin-btn sm danger" id="bulk-delete">Delete</button>
              </div>
            </div>
            <div id="admin-leads-list">
              <div class="admin-spinner"></div>
            </div>
          </div>
        </main>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script src="/admin/js/admin.js"></script>
    <script src="/admin/js/pages/leads.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        AdminPages.leads.init();
      });
    </script>
  </body>
</html>
